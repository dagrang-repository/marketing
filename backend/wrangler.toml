# Cloudflare Worker config for the Payment Foundation backend (worker.js)
# Deploy with:  wrangler deploy   (also registers the cron trigger below)
#
# 1) KV namespace (one time):  wrangler kv namespace create STORE
#    then paste the printed id into kv_namespaces.id below.
#
# 2) Secrets are NOT stored here. Set each with `wrangler secret put NAME`:
#      ADMIN_EMAIL            command-board email
#      RESEND_API_KEY         re_...  (login codes + payment-sent emails)
#      MAIL_FROM              "Marketing <no-reply@yourdomain.com>"  (verified Resend sender)
#      VELIANE_SECRET         shared secret your OWNED sites send in x-veliane-secret.
#                             Covers /veliane/signup, /veliane/activity, /veliane/intake
#                             AND /owned/click — one secret for every site you own.
#      STRIPE_WEBHOOK_SECRET  whsec_...  (only if you credit purchases via Stripe)
#      TRACK_SECRET           x-track-secret for /track/event (your in-house tracker).
#                             OPTIONAL — if unset, /track/event falls back to VELIANE_SECRET.
#
# Optional tunables (safe defaults in code — set only to override), via
# `wrangler secret put` or the [vars] block below:
#      STRIPE_CREDIT          "1" to credit purchases on the Stripe webhook (default OFF)
#      HOLD_DAYS              days a signup is held before the day-3 active recheck (default 3)
#      ACTIVE_WINDOW_DAYS     "active" = seen within this many days at recheck (default 2)
#      RL_EMAIL_PER_HOUR      /auth/request code requests per email per hour (default 7)
#      RL_IP_PER_HOUR         /auth/request code requests per IP per hour (default 15)
#      CLUSTER_WARN           city-cluster clicks that flag a WARN (default 2000)
#      CLUSTER_BAN            city-cluster clicks that AUTO-BAN (default 4000)
#      API_ORIGIN             public origin every /go/ link is built on (default =
#                             this Worker's workers.dev URL). Set it to a branded
#                             domain such as https://go.veliane.org ONLY AFTER that
#                             domain is attached to this Worker (Cloudflare dashboard
#                             -> marketing-foundation -> Settings -> Domains & Routes).
#                             Existing auto-filled /go/ links re-point themselves on
#                             the next board load / worker login / daily cron.
#
# FRAUD DETECTION = CITY-CLUSTER (LIVE): clicks tallied per coarse geo
# (country|region|city). Spread across many cities -> never flagged.
# Concentrated in one city -> WARN at CLUSTER_WARN, AUTO-BAN at CLUSTER_BAN.
# Ban only; earned balance is never reduced. Geo comes from owned sites
# (request body) and from the /go redirector (request.cf).
#
# SESSIONS do NOT expire on a device (persistent token) — no SESSION_TTL_HOURS.

name = "marketing-foundation"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "STORE"
id = "7351968bf87d41979df8a0ebe99cabc7"

# Daily cron (03:00 UTC) — resolves day-3 owned-site signups and runs the
# add-only reconcile. REQUIRED for the worker.js-owned signup flow to credit.
[triggers]
crons = ["0 3 * * *"]

# Non-secret defaults (uncomment a line to override the code default):
[vars]
API_ORIGIN = "https://go.veliane.org"
# HOLD_DAYS = "3"
# ACTIVE_WINDOW_DAYS = "2"
# RL_EMAIL_PER_HOUR = "7"
# RL_IP_PER_HOUR = "15"
# CLUSTER_WARN = "2000"
# CLUSTER_BAN = "4000"
